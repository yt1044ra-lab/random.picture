<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>ARGUS ADMIN</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
background:black;
color:#0ff;
font-family:monospace;
min-height:100vh;
display:flex;
justify-content:center;
align-items:center;
overflow:hidden;
}

#logo{
position:fixed;
top:20px;
left:20px;
width:60px;
height:auto;
z-index:9999;
}

#panel{
width:900px;
max-width:90%;
border:2px solid #0ff;
padding:40px;
background:rgba(0,255,255,0.03);
box-shadow:
0 0 20px #0ff,
inset 0 0 20px rgba(0,255,255,0.1);
}

h1{
text-align:center;
margin-bottom:30px;
text-shadow:0 0 20px #0ff;
letter-spacing:5px;
}

.section{
margin-bottom:25px;
}

label{
display:block;
margin-bottom:10px;
font-size:18px;
}

input{
width:100%;
padding:15px;
background:#111;
border:2px solid #0ff;
color:#0ff;
font-size:20px;
outline:none;
}

button{
padding:15px 30px;
background:black;
color:#0ff;
border:2px solid #0ff;
cursor:pointer;
font-size:18px;
margin-right:10px;
margin-top:10px;
}

button:hover{
background:#022;
}

#playerBox{
display:none;
margin-top:25px;
padding:20px;
border:1px solid #0ff;
}

.info{
font-size:28px;
margin-bottom:15px;
}

.score{
font-size:50px;
text-shadow:0 0 20px #0ff;
}

.group{
font-size:30px;
margin-top:10px;
}

#running{
display:none;
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:black;
justify-content:center;
align-items:center;
flex-direction:column;
z-index:99999;
}

#runImage{
max-width:600px;
max-height:60vh;
margin-bottom:30px;
}

#timer{
font-size:90px;
text-shadow:0 0 20px #0ff;
}

#resetBtn{
margin-top:40px;
}

</style>
</head>
<body>

<img id="logo" src="argus.png">

<div id="panel">

<h1>ARGUS ADMIN</h1>

<div class="section">

<label>行番号</label>

<input
type="number"
id="rowInput"
placeholder="2">

<button onclick="loadPlayer()">
SEARCH
</button>

</div>

<div class="section">

<label>グループ1境界値</label>

<input
type="number"
id="limitInput"
value="500">

<button onclick="saveLimit()">
SAVE LIMIT
</button>

</div>

<div id="playerBox">

<div
class="info"
id="codename">
CODE NAME :
</div>

<div
class="score"
id="score">
0
</div>

<div
class="group"
id="group">
GROUP : 0
</div>

<button onclick="startMission()">
START
</button>

<button onclick="resetMission()">
RESET
</button>

</div>

</div>

<div id="running">

<img
id="runImage"
src="">

<div id="timer">
01:00
</div>

<button
id="resetBtn"
onclick="resetMission()">
RESET
</button>

</div>

</body>
<script>

const RANKING_URL =
"https://script.google.com/macros/s/AKfycbwSRP0UYMd96CnH3la3Mt7YL6uSrr5rHSxx9J3tseSLX2g7vTtXpYlxzBmOXAbUVZxF6w/exec";

const SYSTEM_URL =
"https://script.google.com/macros/s/AKfycby9_J7JGBynd9CSAFDS-6V3VjSXLwboQWhfYVq_SCstEFMhvU8Ewk7_T_t6xMvSqsby/exec";

let currentPlayer = null;
let currentGroup = 0;
let timerInterval = null;
let started = false;

async function loadPlayer(){

  const row =
    Number(
      document.getElementById("rowInput").value
    );

  if(row < 2){
    alert("2以上を入力");
    return;
  }

  const res =
    await fetch(RANKING_URL);

  const data =
    await res.json();

  const player =
    data[row - 2];

  if(!player){
    alert("該当なし");
    return;
  }

  currentPlayer = player;

  const limit =
    Number(
      document.getElementById("limitInput").value
    );

  currentGroup =
    player.score >= limit
    ? 1
    : 0;

  document.getElementById("playerBox")
    .style.display = "block";

  document.getElementById("codename")
    .textContent =
      "CODE NAME : " +
      player.name;

  document.getElementById("score")
    .textContent =
      player.score + " pts";

  document.getElementById("group")
    .textContent =
      "GROUP : " +
      currentGroup;

}

async function saveLimit(){

  const limit =
    Number(
      document.getElementById("limitInput").value
    );

  await fetch(
    SYSTEM_URL,
    {
      method:"POST",

      body:JSON.stringify({

        action:"limits",

        limit0:0,
        limit1:limit

      })
    }
  );

  alert("保存しました");

}

async function startMission(){

  if(!currentPlayer){
    alert("先に検索してください");
    return;
  }

  const image =
    currentGroup === 0
      ? "0_1.jpg"
      : "1_1.png";

  await fetch(
    SYSTEM_URL,
    {
      method:"POST",

      body:JSON.stringify({

        action:"start",

        group:currentGroup,

        image:image,

        endTime:0

      })
    }
  );

  document.getElementById("running")
    .style.display = "flex";

  document.getElementById("runImage")
    .src = image;

  document.getElementById("timer")
    .textContent =
      "WAITING...";

  started = false;

}

function startTimer(endTime){

  clearInterval(timerInterval);

  timerInterval =
    setInterval(()=>{

      const remain =
        endTime - Date.now();

      if(remain <= 0){

        document
          .getElementById("timer")
          .textContent =
            "00:00";

        clearInterval(
          timerInterval
        );

        return;
      }

      const sec =
        Math.floor(
          remain / 1000
        );

      const min =
        String(
          Math.floor(sec / 60)
        ).padStart(2,"0");

      const s =
        String(
          sec % 60
        ).padStart(2,"0");

      document
        .getElementById("timer")
        .textContent =
          min + ":" + s;

    },100);

}

async function resetMission(){

  await fetch(
    SYSTEM_URL,
    {
      method:"POST",

      body:JSON.stringify({

        action:"reset"

      })
    }
  );

  location.reload();

}

async function watchSystem(){

  try{

    const res =
      await fetch(
        SYSTEM_URL +
        "?t=" +
        Date.now()
      );

    const state =
      await res.json();

    if(
  state.active &&
  !started &&
  Number(state.endTime) > 0
){

  started = true;

  document
    .getElementById("timer")
    .style.fontSize =
      "90px";

  document
    .getElementById("timer")
    .textContent =
      "01:00";

  startTimer(
    Number(state.endTime)
  );

}

/*
    if(
      !state.active &&
      (
        document
          .getElementById("running")
          .style.display === "flex"
      )
    ){

      location.reload();

    }
    */

  }catch(err){

    console.log(err);

  }

}

setInterval(
  watchSystem,
  200
);

</script>
